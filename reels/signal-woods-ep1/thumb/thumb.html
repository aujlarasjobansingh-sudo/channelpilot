<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:R;src:url(../node_modules/@fontsource/rubik/files/rubik-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:R;src:url(../node_modules/@fontsource/rubik/files/rubik-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#000}
#t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:R}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15) contrast(1.08);transform:scale(1.12) translate(60px,-40px)}
.top{position:absolute;left:0;right:0;top:0;height:720px;background:linear-gradient(#05060cf2 0%,#05060cd9 45%,#05060c00 100%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(#05060c00,#05060cee 70%)}
.ep{position:absolute;top:120px;left:0;right:0;text-align:center;font-weight:800;font-size:40px;letter-spacing:12px;color:#ffd23f}
h1{position:absolute;top:185px;left:40px;right:40px;margin:0;text-align:center;font-weight:900;font-size:150px;line-height:.95;color:#fff;
  text-transform:uppercase;-webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:0 0 40px #ff1e1e,0 10px 0 #000}
h1 span{color:#ff2b2b}
.tag{position:absolute;padding:14px 26px;border-radius:18px;font-weight:900;font-size:46px;border:5px solid #000;box-shadow:0 8px 0 #000}
.real{left:60px;bottom:400px;background:#6fb6ff;color:#06142a;transform:rotate(-5deg)}
.trap{left:70px;top:800px;background:#ff2b2b;color:#fff;transform:rotate(-6deg)}
.ring{position:absolute;left:560px;top:740px;width:190px;height:470px;border:10px solid #ffd23f;border-radius:50%;box-shadow:0 0 25px #000,inset 0 0 25px #000}
.q{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-weight:900;font-size:84px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill}
.q b{color:#3ddc6a} .q i{color:#ff2b2b;font-style:normal}
</style></head><body><div id="t">
<img id="bg" src="bg.png">
<div class="top"></div><div class="bot"></div>
<div class="ep">EPISODE 1 • 1986</div>
<h1>Which one<br>is <span>real?</span></h1>
<div class="ring"></div>
<div class="tag trap">HIM? 👀</div>
<div class="tag real">📻 THE RADIO?</div>
<div class="q"><b>🟢</b> OR <i>🔴</i> ?</div>
</div></body></html>
