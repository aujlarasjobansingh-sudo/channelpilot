<!doctype html>
<!-- POV 3D Animation — SINGLE-FILE EDITION (made by aivxer).
     One HTML file: real 3D (three.js) toon world + ink outlines + stereographic wide lens + POV hands + characters with
     faces and lip-flap + colour-coded subtitles + title card + end-screen choice + synthesized rain/hits + a RECORD button
     that saves the finished video (WebM, with audio). Open it in any desktop browser (or a chat app's HTML preview/Canvas).
     HOW TO MAKE A NEW EPISODE: edit only the sections marked  ✏️ STORY / ✏️ SET / ✏️ CAST / ✏️ SHOTS.
     Never replace the ENGINE section with a 2D renderer. -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap">
<style>

  #wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
  #out{width:min(405px,92vw);aspect-ratio:9/16;border-radius:14px;background:#000;box-shadow:0 10px 40px #000a}
  #out.land{width:min(860px,94vw);aspect-ratio:16/9}
  #gl{display:none}
  .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  button,label.btn{font:800 15px Rubik,sans-serif;border:3px solid #111;border-radius:12px;padding:10px 16px;cursor:pointer;background:#f5d23a;color:#111;box-shadow:0 4px 0 #111}
  button.rec{background:#e2372f;color:#fff} input[type=file]{display:none} #status{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="wrap">
  <canvas id="out"></canvas><canvas id="gl"></canvas>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="rec" class="rec">● Record video</button>
    <label class="btn">🎙 Add voice files<input id="voices" type="file" accept="audio/*" multiple></label>
  </div>

    preview uses the browser voice (not recorded). Recording plays the episode once in real time, then downloads it.</div>
</div>

    add(new THREE.Mesh(new THREE.CircleGeometry(.028, 24), flat('#fff')), e); add(new THREE.Mesh(new THREE.RingGeometry(.028, .033, 28), flat('#17171b')), e);
    const p = add(new THREE.Mesh(new THREE.CircleGeometry(.012, 16), flat('#17171b')), e); p.position.z = .001; return { e, p }; });

  CAST.maya.show(t > 3.8);
}

// =====================================================================================================
// ✏️ SHOTS — camera keys, POV hand poses, lights/flashes per time (match the dialogue)
// =====================================================================================================
const START = { yaw: 0, pitch: -6, x: 0, y: EYE, z: .2, f: 560 };
K(0, 3.6, { yaw: -4, f: 540 }, 'lin');                         // slow drift on the empty store
K(4.0, 4.35, { yaw: 2, pitch: -2, f: 600 }, 'snap');           // snap to the door as she bursts in
K(6.1, 6.6, { pitch: -4, f: 640 });                            // push in on her
K(13.8, 14.2, { yaw: 9, pitch: -40, f: 560 }, 'snap');          // down to the lock button
K(15.0, 15.6, { yaw: 0, pitch: -3, f: 600 });
shake(4.0, 1.5); shake(14.6, 1.0);
function shotsAt(t) {
  povHands(t > 14.0 && t < 15.0 ? 'reach' : 'rest', t, SET.btn.position);
  SET.door.rotation.y = t > 4.0 && t < 6.5 ? -1.2 * Math.sin(seg(t, 4.0, 6.5) * Math.PI) : 0;
  SET.btn.position.y = CT + .03 - (t > 14.55 && t < 14.8 ? .012 : 0);
  const ph = (t * 2.1) % 1, on = t > 10.6; SET.red.material.opacity = on && ph < .5 ? 1 : .05; SET.blue.material.opacity = on && ph >= .5 ? 1 : .05;
  lens.uniforms.wash.value = on ? .2 : 0; lens.uniforms.washCol.value.set(ph < .5 ? '#ff2020' : '#2050ff');
  lens.uniforms.flash.value = t > 4.0 && t < 4.12 ? .1 : 0;
}

// =====================================================================================================
// ENGINE: playback, HUD, audio, recording — do not rewrite
// =====================================================================================================
buildSet(); buildCast();
const chunks = []; for (const [id, spk, t0, t1, text] of STORY.lines) { const ws = text.split(/\s+/); const g = []; let cur = []; for (const w of ws) { cur.push(w); if (cur.length >= 3 || /[.!?,]$/.test(w)) { g.push(cur.join(' ')); cur = []; } } if (cur.length) g.push(cur.join(' '));
  const tot = g.reduce((a, c) => a + c.length + 3, 0); let c0 = t0; for (const c of g) { const d = (t1 - t0) * (c.length + 3) / tot; chunks.push({ t0: c0, t1: c0 + d, text: c, spk, id }); c0 += d; } }
const voiceBuf = {}; let actx = null;
const env = {}; // per-speaker mouth envelope sampled from the voice files (else a talking flap)
function mouthOf(spk) { const t = NOW; const l = STORY.lines.find(l => l[1] === spk && t >= l[2] && t <= l[3]); if (!l) return 0; const b = voiceBuf[l[0]];
  if (b && env[l[0]]) { const i = Math.floor((t - l[2]) * 30); return env[l[0]][i] || 0; } return .45 + .45 * Math.sin(t * 22) * Math.sin(t * 9.3); }
let NOW = 0;
function hud(t) {

  const font = (w, s) => `${w} ${s}px Rubik, system-ui, sans-serif`, stroke = (txt, x, y, s, col, sw) => { c.lineJoin = 'round'; c.lineWidth = sw; c.strokeStyle = '#111'; c.strokeText(txt, x, y); c.fillStyle = col; c.fillText(txt, x, y); };
  const a = easeOut(seg(t, .15, .55)) * (1 - seg(t, 4.0, 4.4));
  if (a > 0) { c.globalAlpha = a; c.textAlign = 'left'; c.font = font(900, 36); stroke(STORY.title[0], 42, 130, 36, STORY.colors.ui, 7); c.font = font(800, 22); stroke(STORY.title[1], 42, 162, 22, '#fff3c4', 5); c.globalAlpha = 1; }
  const s = chunks.find(k => t >= k.t0 && t < k.t1);
  if (s && t < STORY.freeze + .3) { const k = .91 + .09 * easeOut(seg(t, s.t0, s.t0 + .1)); c.translate(W / 2, H * .68); c.scale(k, k); c.textAlign = 'center'; c.font = font(800, LAND ? 40 : 44.5); stroke(s.text, 0, 0, 44, STORY.colors[s.spk] || '#fff', 9); c.setTransform(1, 0, 0, 1, 0, 0); }
  if (t > STORY.freeze + .1) {
    const k = easeOut(seg(t, STORY.freeze + .1, STORY.freeze + .5)); c.globalAlpha = k; c.textAlign = 'center';
    const qy = H * .38; STORY.end.question.split('<br>').forEach((q, i) => { c.font = font(900, 54); stroke(q, W / 2, qy + i * 58, 54, '#fff', 10); });
    const btn = (txt, y, col, dot) => { const bw = 520, bh = 92, x = W / 2 - bw / 2; c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.roundRect(x, y + 9, bw, bh, 20); c.fill();
      c.fillStyle = col; c.strokeStyle = '#0d0e12'; c.lineWidth = 4; c.beginPath(); c.roundRect(x, y, bw, bh, 20); c.fill(); c.stroke();
      c.fillStyle = dot; c.beginPath(); c.arc(x + 46, y + bh / 2, 15, 0, 7); c.fill(); c.stroke(); c.font = font(900, 34); c.fillStyle = '#fff'; c.fillText(txt, W / 2 + 18, y + bh / 2 + 12); };
    btn(STORY.end.green, qy + 150, '#2fae55', '#7dffa0'); c.font = font(900, 30); stroke('OR', W / 2, qy + 290, 30, STORY.colors.ui, 6); btn(STORY.end.red, qy + 310, '#d8352d', '#ff8a80');
    c.font = font(800, 30); stroke(STORY.end.bottom, W / 2, qy + 500, 30, STORY.colors.ui, 6); c.globalAlpha = 1;
  }

}
function frame(tReal) {
  NOW = Math.min(tReal, STORY.freeze); const t = NOW;
  const c = camAt(t, START);
  for (const [t0, a] of SHAKES) if (t > t0 && t < t0 + .45) { const d = t - t0; c.yaw += a * Math.exp(-d * 11) * Math.sin(d * 55); c.pitch += a * .7 * Math.exp(-d * 11) * Math.cos(d * 47); }
  camera.position.set(c.x, c.y, c.z); camera.rotation.set(c.pitch * D2R, c.yaw * D2R, (c.roll || 0) * D2R); camera.updateMatrixWorld(); setFocal(c.f);
  castAt(t, mouthOf); shotsAt(t);
  lens.uniforms.vign.value = .85 * easeOut(seg(tReal, STORY.freeze - .15, STORY.freeze + .4));
  renderer.setRenderTarget(rt); effect.render(scene, camera); renderer.setRenderTarget(null); renderer.render(qScene, qCam);
  octx.drawImage(glc, 0, 0); hud(tReal);
}
// ---- audio: voice files + synthesized rain bed and hits (all routed into the recording)
function ensureAudio() { if (!actx) actx = new AudioContext(); return actx; }
document.getElementById('voices').onchange = async e => { const ac = ensureAudio(); let n = 0;
  for (const f of e.target.files) { const id = f.name.replace(/\.[^.]+$/, '').toLowerCase(); try { const b = await ac.decodeAudioData(await f.arrayBuffer()); voiceBuf[id] = b; n++;
    const d = b.getChannelData(0), hop = Math.floor(b.sampleRate / 30), e2 = []; let mx = 1e-6; for (let i = 0; i < d.length; i += hop) { let s = 0; for (let j = i; j < Math.min(d.length, i + hop); j++) s += d[j] * d[j]; const v = Math.sqrt(s / hop); e2.push(v); mx = Math.max(mx, v); } env[id] = e2.map(v => Math.min(1, v / mx * 1.6)); } catch (err) { console.warn(f.name, err); } }
  document.getElementById('status').textContent = `Loaded ${n} voice file(s): ${Object.keys(voiceBuf).join(', ')}`; };
function scheduleAudio(ac, dest, t0) {
  const len = STORY.duration, nb = ac.createBuffer(2, ac.sampleRate * len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = nb.getChannelData(ch); let lp = 0; for (let i = 0; i < d.length; i++) { lp += .07 * ((Math.random() * 2 - 1) - lp); d[i] = lp * .55; } }
  const rain = ac.createBufferSource(); rain.buffer = nb; const rg = ac.createGain(); rg.gain.value = .5; rain.connect(rg).connect(dest); rain.start(t0);
  const hit = (at, f = 60, g = .9) => { const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.setValueAtTime(f, t0 + at); o.frequency.exponentialRampToValueAtTime(f * .5, t0 + at + .4); gg.gain.setValueAtTime(g, t0 + at); gg.gain.exponentialRampToValueAtTime(.001, t0 + at + .6); o.connect(gg).connect(dest); o.start(t0 + at); o.stop(t0 + at + .7); };
  for (const [ts] of SHAKES) hit(ts); hit(STORY.freeze, 40, 1.2);
  for (const [id, spk, s] of STORY.lines) { const b = voiceBuf[id]; if (!b) continue; const src = ac.createBufferSource(); src.buffer = b; const g = ac.createGain(); g.gain.value = 1.6; src.connect(g).connect(dest); src.start(t0 + s); }
}
let playing = false;
function run(record) {
  if (playing) return; playing = true; const ac = ensureAudio(); ac.resume();
  const mix = ac.createGain(); mix.connect(ac.destination); let rec = null, parts = [];
  if (record) { const sd = ac.createMediaStreamDestination(); mix.connect(sd); const st = out.captureStream(30); sd.stream.getAudioTracks().forEach(tr => st.addTrack(tr));
    const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    rec = new MediaRecorder(st, { mimeType: mime, videoBitsPerSecond: 8e6 }); rec.ondataavailable = e => e.data.size && parts.push(e.data);
    rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, { type: 'video/webm' })); a.download = 'pov_episode.webm'; a.click(); document.getElementById('status').textContent = 'Saved pov_episode.webm — convert to MP4 in any free converter (or CapCut) if your app needs MP4.'; };
    rec.start(); }
  const t0 = ac.currentTime + .15; scheduleAudio(ac, mix, t0);
  const hasVoice = Object.keys(voiceBuf).length > 0, said = new Set();
  const tick = () => { const t = ac.currentTime - t0; frame(Math.max(0, t));
    if (!record && !hasVoice && 'speechSynthesis' in window) for (const [id, , s, , text] of STORY.lines) if (t >= s && !said.has(id)) { said.add(id); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
    if (t < STORY.duration) requestAnimationFrame(tick); else { playing = false; if (rec) rec.stop(); mix.disconnect(); } };
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = () => run(false);
document.getElementById('rec').onclick = () => run(true);
window.renderAt = t => frame(t);                    // for automated checks: renderAt(seconds) draws one frame
document.fonts.ready.then(() => frame(0.8));
</script></body></html>
